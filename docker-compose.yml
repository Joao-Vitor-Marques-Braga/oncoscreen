services:
  backend:
    build:
      context: ./backend
    container_name: oncoscreen-backend
    network_mode: host
    env_file:
      - .env
    volumes:
      - ./backend/storage:/app/storage
      - ./backend/weights:/app/weights
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: oncoscreen-frontend
    network_mode: host
    depends_on:
      - backend
    restart: unless-stopped

